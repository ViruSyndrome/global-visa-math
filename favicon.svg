<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Background navy-to-blue gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Accent sky-blue gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background circle with smooth gradient and shadow border -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="1.5"/>
  
  <g transform="rotate(-8 16 16)">
    <!-- Stamp outer border -->
    <rect x="6" y="7" width="20" height="18" rx="2.5" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Stamp inner dashed border -->
    <rect x="8.5" y="9.5" width="15" height="13" rx="1.5" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.7"/>
    <!-- Horizontal divider -->
    <line x1="8.5" y1="16" x2="23.5" y2="16" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Top-left: Mini Globe -->
    <circle cx="12" cy="12.5" r="2.2" stroke="#ffffff" stroke-width="1"/>
    <line x1="9.8" y1="12.5" x2="14.2" y2="12.5" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <line x1="12" y1="10.3" x2="12" y2="14.7" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Top-right: Star -->
    <path d="M19.5 12.5l.4-.8.8-.4-.8-.4-.4-.8-.4.8-.8.4.8.4.4.8z" fill="#ffffff" stroke="none"/>
    
    <!-- Bottom: Checkmark representing compliance checks -->
    <path d="M11 20.5l2 2 5-5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
