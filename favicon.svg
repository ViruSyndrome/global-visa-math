<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#1a365d"/>
  <!-- Globe wireframe (white) -->
  <!-- Outer circle -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Equator line -->
  <line x1="6" y1="16" x2="26" y2="16" stroke="white" stroke-width="1.5"/>
  <!-- Vertical meridian -->
  <line x1="16" y1="6" x2="16" y2="26" stroke="white" stroke-width="1.5"/>
  <!-- Left longitude arc -->
  <path d="M16 6 Q10 16 16 26" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Right longitude arc -->
  <path d="M16 6 Q22 16 16 26" fill="none" stroke="white" stroke-width="1.5"/>
