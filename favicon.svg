<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Background navy-to-blue gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Accent sky-blue gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background circle with smooth gradient and shadow border -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="1.5"/>
  
  <!-- Subtle Globe Wireframe Lines -->
  <!-- Longitude arcs -->
  <path d="M16 2.5 A13.5 13.5 0 0 1 16 29.5" stroke="#93c5fd" stroke-width="0.8" opacity="0.3"/>
  <path d="M16 2.5 A13.5 13.5 0 0 0 16 29.5" stroke="#93c5fd" stroke-width="0.8" opacity="0.3"/>
  <path d="M16 2.5 A8.5 13.5 0 0 1 16 29.5 M16 2.5 A8.5 13.5 0 0 0 16 29.5" stroke="#93c5fd" stroke-width="0.8" opacity="0.35"/>
  <!-- Latitude lines -->
  <line x1="2.5" y1="16" x2="29.5" y2="16" stroke="#93c5fd" stroke-width="0.8" opacity="0.4"/>
  <path d="M5.5 9.5 C10 11.5 22 11.5 26.5 9.5" stroke="#93c5fd" stroke-width="0.8" opacity="0.35"/>
  <path d="M5.5 22.5 C10 20.5 22 20.5 26.5 22.5" stroke="#93c5fd" stroke-width="0.8" opacity="0.35"/>
  
  <!-- Passport/Star center highlight -->
  <circle cx="16" cy="16" r="2.5" fill="#ffffff" opacity="0.9"/>
  
  <!-- "Math / Visa Movement" Dynamic Ascent Curve -->
  <path d="M7.5 21.5 Q12 18 15.5 16.5 T24.5 10.5" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mathematical checkmark / arrow accent at the tip -->
  <path d="M20.5 10.5h4v4" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
